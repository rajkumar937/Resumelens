{% extends "base.html" %}
{% block title %}ResumeLens — Offline{% endblock %}
{% block content %}
<section class="upload-section" aria-label="Offline">
  <div class="container">
    <div class="upload-card" style="text-align:center;">
      <div class="drop-icon" style="font-size:3rem;">📡</div>
      <h1 class="upload-title">You're offline</h1>
      <p class="upload-subtitle">
        Resume analysis and history need an internet connection.
        Reconnect and reload to continue.
      </p>
      <button class="btn btn--primary" onclick="location.reload()">Retry</button>
    </div>
  </div>
</section>
{% endblock %}
